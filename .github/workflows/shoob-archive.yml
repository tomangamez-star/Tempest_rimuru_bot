name: Rimuru Shoob Archive Ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: "*/2 * * * *"

concurrency:
  group: rimuru-shoob-archive
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: false
      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4 psycopg2-binary selenium
      - name: Ingest next Shoob batch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          SHOOB_ARCHIVE_CHAT_ID: ${{ secrets.SHOOB_ARCHIVE_CHAT_ID }}
          SHOOB_BATCH_SIZE: "20"
          SHOOB_SEND_DELAY: "1.25"
        run: python scripts/shoob_archive_scraper.py
