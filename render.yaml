# Render blueprint for Rimuru Tempest Casino Bot
# Usage: push repo to GitHub → Render → New → Blueprint → select repo
# (or create a Web Service manually with these settings)
services:
  - type: web
    name: rimuru-casino
    runtime: node
    plan: free # or starter ($7/mo) for persistent disk + better uptime
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false # set this manually in Render dashboard — never commit it
      - key: OWNER_ID
        value: "8781690556"
      - key: GROQ_API_KEY
        sync: false # set this manually in Render dashboard
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # Single instance: Render sometimes briefly runs 2 processes during a
      # deploy (old + new) → Telegram "409 Conflict: terminated by other
      # getUpdates request". Force ONE worker + let the app's instance guard
      # (src/index.js) pick the primary when RENDER_INSTANCE_ID is present.
      - key: WEB_CONCURRENCY
        value: "1"
      # Relative DB path → works on FREE tier (no disk mount needed).
      # The SQLite file lives in the service's ephemeral filesystem and
      # resets on restart/idle. See README "Storage notes" for persistence.
      - key: DB_PATH
        value: ./data/rimuru.db
      - key: DATA_DIR
        value: ./data
      - key: ALLOWED_UPDATES
        value: "messages,callback_query"
      - key: PUBLIC_URL
        value: "" # optional: set to your Render URL if you enable webhooks
      # Admin dashboard (served on the same :PORT as /health):
      #   https://<your-service>.onrender.com/  → dashboard login
      # Login: Telegram user ID 8781690556 (owner) + this password.
      # Set a strong password here — if unset, the bot generates a random
      # one and prints it once to the Render logs on boot.
      - key: DASHBOARD_PASSWORD
        sync: false # set this manually in Render dashboard
      - key: DASHBOARD_ENABLED
        value: "true"
    # 💡 PERSISTENT DISK (paid tiers only — Starter $7/mo and up).
    # Free tier does NOT support disks, so this block is commented out.
    # If you upgrade, uncomment it and change the env vars above to:
    #   DB_PATH=/data/rimuru.db  DATA_DIR=/data
    # disk:
    #   name: rimuru-data
    #   mountPath: /data
    #   sizeGB: 1